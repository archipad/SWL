  <script>
    /* Même thème que l'Assistant : lit swl.theme.v1 ou, en Auto, la faction du Joueur 1 puis du Joueur 2. */
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('swl.theme.v1') || '"auto"');
        var theme = pref;
        if (pref === 'auto') {
          var faction = function (key) { try { var l = JSON.parse(localStorage.getItem(key)); return String((l && l.faction) || '').toLowerCase(); } catch (e) { return ''; } };
          var f = faction('swl.list.p1.v1') || faction('swl.list.p2.v1');
          theme = f.indexOf('rebel') > -1 ? 'rebel' : 'imperial';
        }
        if (theme === 'imperial' || theme === 'rebel') document.documentElement.setAttribute('data-swl-theme', theme);
      } catch (e) { /* thème par défaut */ }
    })();
  </script>
