name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/star-wars-legion-app-49rc3z
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Nécessaire pour que configure-pages puisse activer Pages tout seul la
  # première fois (le site n'existe pas encore côté GitHub).
  administration: write

# N'autorise qu'un déploiement à la fois ; les nouveaux ne s'annulent pas
# entre eux pour ne jamais laisser un déploiement à moitié terminé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
